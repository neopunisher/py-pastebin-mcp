[project]
name = "mcp-pastebin"
version = "0.1.0"
description = "MCP server for the Pastebin API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carter", email = "carter.cole@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "pastebin", "fastmcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=4.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/neopunisher/py-pastebin-mcp"
Repository = "https://github.com/neopunisher/py-pastebin-mcp"
Issues = "https://github.com/neopunisher/py-pastebin-mcp/issues"

[project.scripts]
mcp-pastebin = "mcp_pastebin.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_pastebin"]

[tool.hatch.build.targets.sdist]
include = ["mcp_pastebin", "README.md", "LICENSE"]

[dependency-groups]
dev = ["ruff>=0.6.0"]
