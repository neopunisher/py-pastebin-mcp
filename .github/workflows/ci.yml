name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from the lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Build
        run: uv build

      - name: Smoke-test the built wheel over stdio
        run: uv run --no-project python scripts/smoke_test.py
